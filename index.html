*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#app{display:flex;flex:1;min-height:0}

/* rail */
#side{width:236px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;padding:18px 12px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:10px;padding:0 2px}
.brand .tile{background:#fff;border-radius:12px;padding:10px 12px;display:flex}
.brand img{width:100%;height:auto;display:block}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;padding-left:4px}
.brand b small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h4{margin:8px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted)}
.nav button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:7px;color:var(--side-ink);border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:rgba(255,255,255,.12);border-left-color:var(--gold);font-weight:600}
.nav button .n{margin-left:auto;font-size:12px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.nav button.new{color:var(--side-muted)}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--side-muted);padding:0 4px}
.foot label{display:flex;flex-direction:column;gap:4px}
.foot input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 8px;color:var(--side-ink)}
.sync{display:flex;gap:6px;align-items:flex-start}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin-top:4px}
.sync.ok i{background:#5BD08F}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#top{padding:18px 22px 0;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btitle{font-family:var(--display);font-size:26px;border:1px solid transparent;border-radius:6px;background:none;padding:2px 6px;margin-left:-6px;min-width:0;flex:1 1 220px}
h1.btitle{margin:0 0 0 -6px;font-weight:400}
.btitle:hover{border-color:var(--line)}
.sub{color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
.tools input[type=search]{width:190px}
.chk{display:flex;gap:6px;align-items:center;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:2px;overflow-x:auto}
.tabs button{padding:8px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.btn{background:var(--green);color:#fff;border-radius:7px;padding:8px 14px;font-weight:600}
.btn:hover{background:var(--green-2)}
.ghost{border:1px solid var(--line);border-radius:7px;padding:7px 12px;color:var(--muted);background:var(--surface)}
.ghost:hover{color:var(--ink);background:var(--hover)}
.ghost.sm{padding:3px 8px;font-size:12px}
.danger{color:var(--s-stuck)}
#view>*{flex-shrink:0}
#view{flex:1;overflow:auto;padding:20px 22px 60px;display:flex;flex-direction:column;gap:22px}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:10px 14px}

/* groups + table */
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{display:flex;align-items:center;gap:8px}
.chev{width:22px;height:22px;border-radius:5px;color:var(--gc);font-size:13px;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.grp-name{font-weight:700;font-size:16px;color:var(--gc);border:1px solid transparent;background:none;border-radius:5px;padding:2px 6px;min-width:0;width:min(280px,50vw)}
.grp-name:hover{border-color:var(--line)}
.cnt{color:var(--muted);font-size:12px}
.grp-h .ghost{margin-left:auto;opacity:0}
.grp-h:hover .ghost,.grp-h .ghost:focus-visible{opacity:1}
.tblwrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line);border-left:5px solid var(--gc);background:var(--surface)}
.tbl{min-width:1560px}
.tr{display:grid;grid-template-columns:38px minmax(240px,1fr) 124px 138px 178px 150px 104px 132px 92px 108px 146px 94px 34px;align-items:stretch;border-bottom:1px solid var(--line);min-height:38px}
.tr:last-child{border-bottom:0}
.tr>*{display:flex;align-items:center;min-width:0;border-right:1px solid var(--line)}
.tr>*:last-child{border-right:0}
.th{font-size:12px;font-weight:600;color:var(--muted);background:var(--hover)}
.th>*{padding:0 10px;justify-content:center}
.th>*:nth-child(2){justify-content:flex-start}
.tr:not(.th):not(.add):hover{background:var(--hover)}
.tick{justify-content:center;color:transparent}
.tick::before{content:"";width:17px;height:17px;border:1.5px solid var(--s-todo);border-radius:50%;position:absolute}
.tick{position:relative;font-size:11px;font-weight:700}
.tick.on{color:#fff}
.tick.on::before{background:var(--s-done);border-color:var(--s-done);z-index:0}
.tick span{position:relative;z-index:1}
.namecell{gap:4px;padding-right:6px}
.name{flex:1;min-width:0;border:1px solid transparent;background:none;padding:6px 8px;border-radius:5px;height:30px;margin-left:2px}
.name:hover{border-color:var(--line)}
.name.struck{color:var(--muted);text-decoration:line-through}
.openb{flex:none;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 7px;background:var(--surface);white-space:nowrap}
.openb:hover{color:var(--ink)}
.rep{flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:0 6px}
.cell{justify-content:center;padding:0 8px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell:hover{background:var(--hover);color:var(--ink)}
.pill{justify-content:center;color:#fff;font-weight:600;font-size:13px;padding:0 6px;text-align:center}
.st-todo{background:var(--s-todo)}.st-working{background:var(--s-working)}.st-stuck{background:var(--s-stuck)}.st-done{background:var(--s-done)}
.pr-none{background:transparent;color:var(--muted);font-weight:400}.pr-low{background:var(--p-low)}.pr-medium{background:var(--p-medium)}.pr-high{background:var(--p-high)}.pr-critical{background:var(--p-critical)}
.due{border:0;background:none;padding:0 8px;width:100%;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.due.od{color:var(--s-stuck);font-weight:600}
.x{justify-content:center;color:var(--muted);font-size:18px;opacity:.35}
.x:hover{opacity:1;color:var(--s-stuck)}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;overflow:hidden}
.chip i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tr.add>input{grid-column:2/-1;border:0;background:none;padding:0 12px;color:var(--ink)}
.tr.sum{background:var(--hover);min-height:44px}
.tr.sum>*{justify-content:center;padding:0 10px}
.tr.sum .col{flex-direction:column;line-height:1.1}
.tr.sum small{color:var(--muted);font-size:11px}
.tlp{background:var(--green);color:#fff;border-radius:12px;padding:2px 12px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tlp.none{background:var(--s-todo)}
.duecell{gap:2px;padding-left:6px}
.duecell .due{padding:0 2px;font-size:13px}
.duecell i{flex:none;width:16px;height:16px;border-radius:50%;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff}
.duecell i.ok{background:var(--s-done)}.duecell i.late{background:var(--s-stuck)}
.due.struck{text-decoration:line-through;color:var(--muted)}
.upd-c{gap:6px;padding:0 8px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden}
.money{border:0;background:none;width:100%;text-align:center;padding:0 6px;font-variant-numeric:tabular-nums}
.nt{font-weight:500;color:var(--ink)}
.frow{display:flex;gap:6px;align-items:center}
.frow a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green);font-weight:600}
.frow button{color:var(--muted);font-size:16px;padding:0 4px}
#pop label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.tr.add>input::placeholder{color:var(--muted)}
.tr.add .barcell{grid-column:3/-1;padding:0 12px}
.bar{display:flex;height:10px;width:100%;border-radius:5px;overflow:hidden;background:var(--hover)}
.bar b{display:block}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;align-items:start}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:8px;padding:10px;min-height:160px}
.kcol.over{outline:2px dashed var(--gold)}
.kcol h3{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.kcol h3 i{width:10px;height:10px;border-radius:3px}
.kcol h3 span{margin-left:auto;color:var(--muted);font-weight:500}
.card{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:grab}
.card:hover{border-color:var(--gold);border-left-color:var(--gc)}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:1px 6px}
.od{color:var(--s-stuck)}

/* today + dashboard */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list h3{margin:0;padding:10px 14px;font-size:13px;background:var(--hover);display:flex;gap:8px;border-bottom:1px solid var(--line)}
.list h3 span{color:var(--muted);font-weight:500}
.li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .tick{width:22px;height:22px;flex:none;display:flex;align-items:center}
.li .t{flex:1 1 220px;min-width:0;text-align:left}
.li .t.struck{color:var(--muted);text-decoration:line-through}
.li small{color:var(--muted)}
.li .pill{border-radius:5px;padding:3px 9px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:4px solid var(--tc,var(--line))}
.tile2 b{display:block;font-family:var(--display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums}
.tile2 span{color:var(--muted);font-size:12px}
.own{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.own:last-child{border-bottom:0}
.own .bar{height:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{margin:auto;text-align:center;max-width:380px;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty h2{font-family:var(--display);font-weight:400;color:var(--ink);margin:0;font-size:24px}

/* drawer, popover, modal, toast */
#panel{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:none;flex-direction:column;z-index:20}
#panel.show{display:flex}
.ph{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph input{flex:1;min-width:0;font-family:var(--display);font-size:20px;border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px}
.ph input:hover{border-color:var(--line)}
.pb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label,.pb>label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fields select,.fields input,.pb textarea,.upd input{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 9px;color:var(--ink);min-width:0}
.pb textarea{min-height:90px;resize:vertical}
.updates{display:flex;flex-direction:column;gap:8px}
.u{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.u small{color:var(--muted);display:block;margin-bottom:2px}
.upd{display:flex;gap:8px}
.upd input{flex:1}
#pop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:none;flex-direction:column;gap:5px;width:190px;max-height:320px;overflow:auto}
#pop.show{display:flex}
#pop.wide{width:230px}
.opt{border-radius:6px;padding:7px 10px;text-align:center;font-weight:600}
.opt.plain{text-align:left;font-weight:500}
.opt.plain:hover{background:var(--hover)}
#pop input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);min-width:0}
#modal{position:fixed;inset:0;background:rgba(10,20,14,.5);display:none;place-items:center;z-index:40;padding:16px}
#modal.show{display:grid}
.mbox{background:var(--surface);border-radius:12px;padding:20px;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.mbox .row{display:flex;gap:8px;justify-content:flex-end}
.btn.red{background:var(--s-stuck)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;display:none;max-width:90%}
#toast.show{display:block}

/* icon rail + workspace panel */
#side{width:88px;padding:12px 6px;gap:4px;align-items:stretch}
.rail-logo{flex:none;background:#fff var(--at-light) center/68% no-repeat;border-radius:12px;height:46px;margin:0 8px 10px}
.rb{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--side-ink);font-size:11px;position:relative;line-height:1.15;text-align:center}
.rb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb:hover{background:rgba(255,255,255,.08)}
.rb.on{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.rb.on svg{stroke:#D6BA6E}
.rb .badge{position:absolute;top:2px;right:12px;background:#C9AB5C;color:#14251C;border-radius:8px;font-size:10px;font-weight:700;padding:0 5px}
.rsep{flex:none;height:1px;background:rgba(255,255,255,.16);margin:5px 16px}
#sub{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:16px 12px;overflow-y:auto}
#sub .brand b{font-size:21px}
#sub .nav button{color:var(--ink)}
#sub .nav button:hover{background:var(--hover)}
#sub .nav button.on{background:var(--gold-soft)}
#sub .nav h4,#sub .nav button .n,#sub .nav button.new,#sub .foot{color:var(--muted)}
#sub .foot input{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.star{font-size:20px;color:var(--gold);padding:0 6px;border-radius:6px;line-height:1}
.star:hover{background:var(--hover)}

/* assistant, agents, apps, my work */
.chat{display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto;flex:1}
.msg{padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:88%;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--green);color:#fff}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.hello{display:flex;flex-direction:column;gap:10px;padding-top:4vh}
.hello h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.hello p{margin:0 0 6px;color:var(--muted);font-size:16px}
.sug{text-align:left;padding:12px 14px;font-size:15px;color:var(--ink)}
.chatbar{display:flex;gap:8px;max-width:820px;width:100%;margin:0 auto;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.chatbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);font-size:15px}
.agent{align-items:flex-start}
.agent .av{width:44px;height:44px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.agent small{color:var(--muted)}
.out{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:60px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));min-width:740px}
.calh{padding:6px 8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--hover);border-bottom:1px solid var(--line)}
.cald{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cald.dim{background:var(--hover);color:var(--muted)}
.cald.now{background:var(--gold-soft)}
.cald small{font-size:11px}
.calt2{font-size:11px;color:#fff;border-radius:4px;padding:1px 5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:10px;align-items:center}
.gtrack{position:relative;height:24px;background:var(--hover);border-radius:6px;display:block}
.gtrack b{position:absolute;top:4px;bottom:4px;border-radius:5px;min-width:6px}
.gtrack i{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}
.mw{display:grid;grid-template-columns:minmax(220px,1fr) 130px 150px 130px 90px 132px 100px;align-items:stretch;border-bottom:1px solid var(--line);min-height:38px}
.mw:last-child{border-bottom:0}
.mw>*{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--line);min-width:0;overflow:hidden;white-space:nowrap}
.mw>*:last-child{border-right:0}
.mw .t{text-align:left}
.mw.th{background:var(--hover);font-size:12px;font-weight:600;color:var(--muted)}
.mw .pill{justify-content:center;border-radius:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.grp-name.static{border:0;width:auto;padding:2px 0}
.sw .sp{flex:1}.sw .x{width:28px;flex:none}
.wfb select,.wfb input,.sel{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 10px;min-width:0}
.calt{font-family:var(--display);font-weight:400;font-size:18px;min-width:170px;text-align:center}

.chatbox{max-width:820px;width:100%;margin:0 auto;position:sticky;bottom:0;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:6px}
.chatbox .inner{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.chatbox input[type=text]{border:0;background:none;font-size:15px;padding:6px 2px;min-width:0;outline:none}
.chatbox small{color:var(--muted);text-align:center}
.msgmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:-4px}
#sub .chatq{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);min-width:0;margin:0 2px 4px}
#sub .nav button .del{margin-left:auto;color:var(--muted);opacity:.5;padding:0 4px}
#sub .nav button .del:hover{opacity:1;color:var(--s-stuck)}
#sub .nav button>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-weight:600}
.badge2{background:var(--gold);color:#14251C;border-radius:8px;font-size:11px;font-weight:700;padding:1px 7px}

#sub .brand{flex-direction:row;align-items:center;justify-content:space-between}
.tchat{grid-template-columns:minmax(190px,250px) 1fr}
.chatlog{display:flex;flex-direction:column;gap:8px;overflow-y:auto;height:52vh;min-height:240px;padding:4px}
.chatlog .msg small{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.mem{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(110px,1fr) minmax(170px,1.3fr) 140px minmax(130px,1fr) 190px 34px;align-items:stretch;border-bottom:1px solid var(--line);min-height:40px}
.mem:last-child{border-bottom:0}
.mem>*{display:flex;align-items:center;gap:6px;padding:0 8px;border-right:1px solid var(--line);min-width:0}
.mem>*:last-child{border-right:0}
.mem.th{background:var(--hover);font-size:12px;font-weight:600;color:var(--muted)}
.mem input{border:1px solid transparent;background:none;border-radius:5px;padding:5px 6px;width:100%;min-width:0}
.mem input:hover{border-color:var(--line)}
.lk{color:var(--green);font-weight:600;white-space:nowrap}
.res{font-size:12px;border-left:3px solid var(--s-todo);padding:2px 8px;overflow-wrap:anywhere}
.res.ok{border-color:var(--s-done)}.res.bad{border-color:var(--s-stuck)}
.auto{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:0 5px}
.thumb{max-width:180px;max-height:140px;border-radius:8px;border:1px solid var(--line);display:block}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.cov{display:grid;align-items:stretch;border-bottom:1px solid var(--line);min-height:36px}
.cov:last-child{border-bottom:0}
.cov>*{display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;border-right:1px solid var(--line);font-size:12px;min-width:0;white-space:nowrap}
.cov>*:first-child{justify-content:flex-start;font-size:14px;font-weight:600}
.cov>*:last-child{border-right:0}
.cov.th{background:var(--hover);font-weight:600;color:var(--muted)}
.cov button:hover{background:var(--hover)}
.prow{display:grid;grid-template-columns:150px minmax(150px,1fr) minmax(190px,1.4fr) 92px;gap:8px;align-items:center}

/* ---------- storage: shared database when available, this browser otherwise ---------- */
const Store={mode:'loading',db:null,q:{},readonly:false,
  async init(){
    let db=null;
    try{ if(window.claude&&window.claude.use) db=await window.claude.use('db'); }catch(e){}
    if(db){
      this.db=db; this.mode='shared'; this.sub();
      try{ const u=await window.claude.use('user');
        if(u){ if((await u.can('data.write'))===false)this.readonly=true;
          S.auth.owner=!!(await u.isOwner()); S.auth.editor=!!(await u.canEdit()); S.auth.uid=await u.id();
          if(!S.me){const m=await u.me();if(m&&m.name){S.me=m.name;lsSet('at_me',S.me)}} }
        else S.auth.nouser=true;
      }catch(e){S.auth.nouser=true}
      S.auth.ready=true;
    }else{
      this.mode='local';
      try{ const d=JSON.parse(lsGet(LS)||'{}'); COLLS.forEach(c=>{S[c]=d[c]||{}}); S.team=d.team||[]; S.auto=d.auto||{}; S.socUse=d.socUse||null; }catch(e){}
      S.loaded=true;
    }
    pickStart(); render();
  },
  sub(){
    const timer=setTimeout(()=>{ if(!S.loaded){S.slow=true;render();} },10000);
    const got={b:false,t:false};
    const fin=()=>{ if(got.b&&got.t&&!S.loaded){S.loaded=true;S.slow=false;clearTimeout(timer);pickStart();} schedule(); };
    const err=()=>{ clearTimeout(timer); S.loaded=true; S.slow=true; schedule(); };
    const map=s=>{const m={};s.docs.forEach(d=>{m[d.id]=clone(d.data())});return m};
    this.db.collection('boards').onSnapshot(s=>{S.boards=map(s);got.b=true;fin()},err);
    this.db.collection('tasks').onSnapshot(s=>{S.tasks=map(s);got.t=true;fin()},err);
    this.db.collection('msgs').orderBy('at','desc').limit(600).onSnapshot(s=>{S.msgs=map(s);schedule()},()=>{});
    this.db.collection('access').onSnapshot(s=>{S.access=map(s);S.accessLoaded=true;schedule()},()=>{S.accessLoaded=true;schedule()});
    ['branches','posts','docs','rules','agents','meetings','members','claims'].forEach(c=>this.db.collection(c).onSnapshot(s=>{S[c]=map(s);schedule()},()=>{}));
    this.db.doc('meta/auto').onSnapshot(s=>{S.auto=s.exists?clone(s.data()):{};schedule()},()=>{});
    this.db.doc('meta/social').onSnapshot(s=>{S.socUse=s.exists&&Array.isArray(s.data().use)?s.data().use.slice():null;schedule()},()=>{});
    this.db.doc('meta/team').onSnapshot(s=>{S.team=s.exists?((s.data().members)||[]).slice():[];schedule()},()=>{});
  },
  write(path,fn){
    this.q[path]=(this.q[path]||Promise.resolve()).then(fn).catch(e=>this.fail(e));
  },
  blocked(){ if(this.readonly){toast('You have view-only access. Ask the owner for Contributor access.');return true} return false },
  saveLocal(){ const o={team:S.team,auto:S.auto,socUse:S.socUse}; COLLS.forEach(c=>{o[c]=S[c]}); lsSet(LS,JSON.stringify(o)) },
  put(coll,id,data){
    if(this.blocked())return;
    S[coll][id]=data;
    if(this.mode==='local')return this.saveLocal();
    const body=clone(this.sb?enrich(coll,data):data); this.write(coll+'/'+id,this.sb?()=>hostW(sb.from('docs').upsert({coll,id,data:body})):()=>this.db.doc(coll+'/'+id).set(body));
  },
  del(coll,id){
    if(this.blocked())return;
    delete S[coll][id];
    if(this.mode==='local')return this.saveLocal();
    this.write(coll+'/'+id,this.sb?()=>hostW(sb.from('docs').delete().eq('coll',coll).eq('id',id)):()=>this.db.doc(coll+'/'+id).delete());
  },
  setMeta(key,val){
    if(this.blocked())return;
    S[key]=val;
    if(this.mode==='local')return this.saveLocal();
    const body=key==='team'?{members:val.slice()}:key==='socUse'?{use:val.slice()}:clone(val), doc=key==='socUse'?'social':key; this.write('meta/'+doc,this.sb?()=>hostW(sb.from('docs').upsert({coll:'meta',id:doc,data:body})):()=>this.db.doc('meta/'+doc).set(body));
  },
  setTeam(list){ this.setMeta('team',list) },
  fail(e){
    if(this.sb){toast(/row-level|violates|permission/i.test((e&&e.message)||'')?'Your role does not allow that change, so it was not saved.':'That change was not saved. Check your connection and try again.');return}
    const c=e&&e.code;
    if(c==='invalid_argument'){this.readonly=true;toast('You have view-only access. Ask the owner for Contributor access.')}
    else if(c==='quota_exceeded')toast('Storage is full. Delete some old tasks, then try again.');
    else toast('That change was not saved. Check your connection and try again.');
  }
};

/* ---------- helpers ---------- */
function pickStart(){ if(!PAGES[S.cur]&&!S.boards[S.cur]) S.cur='today'; }
function eff(t){
  if(t.status==='done'&&t.repeat&&t.repeat!=='none'&&t.doneDate){
    if(t.repeat==='daily'&&t.doneDate!==today())return 'todo';
    if(t.repeat==='weekly'&&weekKey(t.doneDate)!==weekKey(today()))return 'todo';
  }
  return STATUS[t.status]?t.status:'todo';
}
const overdue=t=>t.due&&t.due<today()&&eff(t)!=='done';
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
const boardsSorted=()=>Object.keys(S.boards).map(id=>({id,...S.boards[id]})).filter(b=>!limited()||b.dept===S.myDept).sort(byOrder);
function myRole(){
  if(Store.mode!=='shared')return 'admin';
  if(!S.auth.ready||!S.accessLoaded)return 'loading';
  if(S.auth.owner||S.auth.editor)return 'admin';
  if(S.auth.nouser)return 'member';
  const a=S.auth.uid&&S.access[S.auth.uid]; return a&&ROLES[a.role]?a.role:'pending';
}
const canSee=k=>{const r=myRole();return k==='workspace'||r==='admin'||r==='manager'||(ROLE_PAGES[r]||[]).includes(k)||(k==='social'&&!!S.social)};
const limited=()=>!!ROLE_PAGES[myRole()];
const isMgr=()=>{const r=myRole();return r==='admin'||r==='manager'||r==='deptmgr'};
const bound=()=>Store.mode==='shared'&&!!(S.auth.uid&&S.access[S.auth.uid]);
const mineOnly=t=>!limited()||t.owner===S.me||(myRole()==='deptmgr'&&!!t.dept&&t.dept===S.myDept);
const tasksOf=bid=>Object.keys(S.tasks).map(id=>({id,...S.tasks[id]})).filter(t=>t.board===bid&&mineOnly(t)).sort(byOrder);
const allTasks=()=>Object.keys(S.tasks).map(id=>({id,...S.tasks[id]})).filter(t=>S.boards[t.board]&&mineOnly(t)).sort(byOrder);
function visible(t){
  if(S.hideDone&&eff(t)==='done')return false;
  if(S.person&&(t.owner||'')!==S.person)return false;
  if(S.q){const q=S.q.toLowerCase();if(!((t.name||'')+' '+(t.owner||'')+' '+(t.notes||'')).toLowerCase().includes(q))return false}
  return true;
}
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const chip=n=>n?`<span class="chip"><i>${esc(initials(n))}</i><span>${esc(n)}</span></span>`:'<span>—</span>';
function patchTask(id,p){ const t=S.tasks[id]; if(!t)return; Store.put('tasks',id,{...t,...p,updatedAt:Date.now(),updatedBy:S.me||''}); }
const rulesList=()=>Object.keys(S.rules).map(id=>({id,...S.rules[id]})).sort(byOrder);
function runRules(ev,t,p){
  rulesList().filter(r=>r.on!==false&&r.trig===ev).forEach(r=>{
    let hit=true;
    if(r.act==='move'){const b=S.boards[t.board],g=b&&(b.groups||[]).find(g=>g.name.toLowerCase()===String(r.arg||'').toLowerCase());if(g)p.group=g.id;else hit=false}
    else if(r.act==='owner'){const o=r.arg||S.me;if(o)p.owner=o;else hit=false}
    else if(r.act==='priority'){if(PRIO[r.arg])p.priority=r.arg;else hit=false}
    else if(r.act==='update'){p.updates=[...(p.updates||t.updates||[]),{by:S.me||'Someone',text:r.arg||'Workflow ran',at:Date.now()}]}
    else hit=false;
    const cur=S.rules[r.id]; if(cur)Store.put('rules',r.id,{...cur,runs:(cur.runs||0)+(hit?1:0),misses:(cur.misses||0)+(hit?0:1),last:Date.now()});
  });
}
function setStatus(id,s){
  const t=S.tasks[id]; if(!t)return; const p={status:s}, changed=eff(t)!==s;
  if(s==='done')p.doneDate=today();
  if(changed&&!Store.readonly)runRules('status:'+s,t,p);
  patchTask(id,p);
  if(t.requestId&&S.requests[t.requestId])Store.put('requests',t.requestId,{...S.requests[t.requestId],taskStatus:s,status:s==='done'?'done':'accepted'});
}
function groupColor(t){ const b=S.boards[t.board]; const g=b&&(b.groups||[]).find(g=>g.id===t.group); return g?g.color:'var(--line)'; }
function prioBar(list){
  const l=list.filter(t=>t.priority); if(!l.length)return '<div class="bar"></div>';
  return '<div class="bar">'+['low','medium','high','critical'].map(k=>{const n=l.filter(t=>t.priority===k).length;return n?`<b style="width:${n/l.length*100}%;background:var(--p-${k})" title="${PRIO[k]}: ${n}"></b>`:''}).join('')+'</div>';
}
function statusBar(list){
  if(!list.length)return '<div class="bar"></div>';
  return '<div class="bar" title="Status of tasks in this group">'+Object.keys(STATUS).map(k=>{
    const n=list.filter(t=>eff(t)===k).length; return n?`<b style="width:${n/list.length*100}%;background:var(--s-${k})" title="${STATUS[k]}: ${n}"></b>`:'';
  }).join('')+'</div>';
}

function chatListHTML(){
  const q=S.chatQ.toLowerCase(), l=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.msgs.some(m=>m.content.toLowerCase().includes(q)));
  return l.map(c=>`<button class="${S.asst==='chat'&&c.id===S.chatId?'on':''}" data-act="openchat" data-id="${c.id}"><span>${brand(c.title)}</span><span class="del" data-act="delchat" data-id="${c.id}" title="Delete chat">×</span></button>`).join('')||'<small style="color:var(--muted);padding:4px 10px">'+(S.chats.length?'No chats match.':'No chats yet.')+'</small>';
}
function asstPanel(){
  const due=S.sched.filter(schedDue).length, it=(v,l,n)=>`<button class="${S.asst===v&&!(v==='chat')?'on':''}" data-act="asst" data-v="${v}">${l}${n?`<span class="n"><span class="badge2">${n}</span></span>`:''}</button>`;
  return `<div class="brand"><b>${AT} TaskDesk</b><button class="ghost sm" data-act="subtoggle" title="Hide this panel" aria-label="Hide this panel">«</button></div>
    <nav class="nav" aria-label="Assistant">
      <button data-act="asst" data-v="new">+ New chat</button>${it('scheduled','Scheduled',due)}${it('personal','Personalization')}${it('skills','Skills')}
      <h4>All chats</h4><input class="chatq" id="chatq" data-field="chatq" value="${esc(S.chatQ)}" placeholder="Search chats" aria-label="Search chats">
      <div id="chatlist" class="nav">${chatListHTML()}</div>
    </nav>
    <div class="foot"><span>Chats, skills and schedules are kept on this device.</span></div>`;
}
async function runAgent(name,prompt){
  if(S.agentRun&&S.agentRun.busy)return; const run=S.agentRun={name,text:'',busy:true}; renderView();
  try{ run.text=await AI.ask(SYS+'\n\nYour job as the "'+name+'" agent: '+prompt+'\n\n'+ctx(),t=>{run.text=t;const el=$('#agent-out');if(el)el.textContent=t}) }catch(e){ run.text=aiErr(e) }
  run.busy=false; if(S.cur==='agents')renderView();
}
let DICT=null;
async function initDict(){
  try{ if(window.claude&&window.claude.use)DICT=await window.claude.use('dictation') }catch(e){}
  if(!DICT)DICT=speechShim();
  if(!DICT)return;
  try{
    DICT.onFinal(x=>{
      if(S.dictTarget==='chat'){const i=$('#chat-in');if(i)i.value+=(i.value&&!/\s$/.test(i.value)?' ':'')+x.text;return}
      const ta=$('#mt-notes');if(ta&&S.meet){ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+x.text;S.draftNotes[S.meet]=ta.value}});
    DICT.onState(x=>{S.listening=x.state==='listening';const b=$('#dictbtn');if(b)b.textContent=S.listening?'Stop dictation':'Start dictation';
      const c=$('#chatmic');if(c)c.textContent=S.listening&&S.dictTarget==='chat'?'Stop mic':'Mic';
      if(!S.listening&&S.dictTarget==='notes'&&S.meet&&S.draftNotes[S.meet]!=null){const v=S.draftNotes[S.meet];delete S.draftNotes[S.meet];saveMeet({notes:v})}});
  }catch(e){DICT=null}
  schedule();
}
function saveMeet(p){const m=S.meet&&S.meetings[S.meet];if(m)Store.put('meetings',S.meet,{...m,...p,updatedAt:Date.now()})}

function authWhy(e,stage){

    :/invalid api key|no api key|jwt/i.test(m)?'The key in config.js does not match this Supabase project. Copy the anon / publishable key again from Project Settings, API.'
    :/failed to fetch|networkerror|load failed/i.test(m)?'TaskDesk could not reach Supabase. Check the Project URL in config.js and your internet connection.'
    :/error sending|smtp|mail/i.test(m)?'Supabase could not send the email. Check Authentication, SMTP settings: for a paid Zoho mailbox the host is usually smtppro.zoho.com, port 465, the username is the full mailbox address, the password is a Zoho app password, and the sender email must be that same mailbox.'
    :/signups? not allowed|signup is disabled|disabled/i.test(m)?'New sign-ups are switched off in Supabase. Under Authentication, Sign In / Providers, turn on "Allow new users to sign up" and keep the Email provider enabled.'
    :/hook/i.test(m)?'The sign-up hook returned an error. Under Authentication, Hooks, check that Before User Created points to the Postgres function public.hook_before_user_created.'
    :/does not have access/i.test(m)?'This email does not have access to TaskDesk. Ask your admin to add you.'

function hostReqs(){
  const RS={waiting:['Waiting','working'],accepted:['Accepted','todo'],declined:['Declined','stuck'],done:['Done','done']}, all=reqList();
  const inc=all.filter(r=>r.byUid!==S.auth.uid&&(!limited()||r.to===S.myDept)), out=all.filter(r=>r.byUid===S.auth.uid||(limited()&&r.from===S.myDept&&r.byUid!==S.auth.uid&&r.to!==S.myDept));
  const card=(r,sent)=>{const ppl=S.people.filter(p=>p.active&&p.department_id===r.to).map(hostName).sort();
    return `<div class="cardx" style="gap:8px"><div class="rowb"><span class="pill st-${RS[r.status][1]}" style="border-radius:5px;padding:2px 9px">${RS[r.status][0]}</span><b>${esc(r.title)}</b><span class="sp"></span><small class="sub">${sent?'To '+esc(deptOf(r.to).name||''):'From '+esc(deptOf(r.from).name||'management')+' · '+esc(r.byName||'')} · ${ago(r.at)}</small></div>
    ${r.details?`<div class="out" style="min-height:0">${esc(r.details)}</div>`:''}
    <small class="sub">${r.priority?'Priority '+PRIO[r.priority]+' · ':''}${r.wantedBy?'Wanted by '+fmtDate(r.wantedBy):'No date given'}${r.status==='accepted'||r.status==='done'?' · Assigned to '+esc(r.assignee||'someone')+' · '+(STATUS[r.taskStatus]||'To do'):''}${r.status==='declined'?' · Reason: '+esc(r.reason||'none given'):''}</small>
    ${!sent&&r.status==='waiting'?`<div class="rowb"><select class="sel" id="as-${r.id}" aria-label="Assign to">${ppl.map(n=>`<option>${esc(n)}</option>`).join('')||'<option value="">No one in this department yet</option>'}</select><button class="btn" data-act="haccept" data-id="${r.id}">Accept and assign</button><input class="addin" id="dr-${r.id}" placeholder="Reason, if declining" style="flex:1 1 160px" aria-label="Reason for declining"><button class="ghost danger" data-act="hdecline" data-id="${r.id}">Decline</button></div>`:''}</div>`};
  return `<div class="cardx"><h3>Ask another department</h3><div class="formgrid"><label class="fl" for="rq-to">To department<select class="sel" id="rq-to">${S.depts.filter(d=>d.id!==S.myDept).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></label>
      <label class="fl" for="rq-title">What do you need?<input class="addin" id="rq-title" placeholder="For example: 3 listing photos edited"></label>
      <label class="fl" for="rq-pr">Priority<select class="sel" id="rq-pr">${Object.keys(PRIO).map(k=>`<option value="${k}">${k?PRIO[k]:'Normal'}</option>`).join('')}</select></label>
      <label class="fl" for="rq-by">Wanted by<input class="addin" type="date" id="rq-by"></label></div>
      <label class="fl" for="rq-det">Details<textarea id="rq-det" style="min-height:70px" placeholder="Anything their manager needs to know"></textarea></label><div><button class="btn" data-act="hsendreq">Send request</button></div></div>
    <h3 class="calt" style="text-align:left">Incoming requests</h3>${inc.map(r=>card(r,false)).join('')||'<small class="sub">Nothing has been asked of your department.</small>'}
    <h3 class="calt" style="text-align:left">Sent requests</h3>${out.map(r=>card(r,true)).join('')||'<small class="sub">You have not sent any requests yet.</small>'}`;
}
function hostDeptCards(){
  if(!Store.sb||limited())return '';
  return `<h3 class="calt" style="text-align:left">Departments</h3><div class="grid2">${S.depts.map(d=>{const l=allTasks().filter(t=>t.dept===d.id),dn=l.filter(t=>eff(t)==='done').length,od=l.filter(overdue).length,b=boardsSorted().find(x=>x.dept===d.id),mg=S.people.filter(p=>p.active&&p.role==='manager'&&p.department_id===d.id).map(hostName).join(', ');
    return `<button class="cardx" style="text-align:left;gap:8px" data-act="go" data-b="${b?b.id:'today'}"><div class="rowb"><b style="font-size:16px">${esc(d.name)}</b><span class="sp"></span><small class="sub">${l.length?Math.round(dn/l.length*100):0}% done</small></div>${statusBar(l)}<small class="sub">${l.length-dn} open · <span class="${od?'od':''}">${od} overdue</span> · Manager: ${esc(mg||'not set')}</small></button>`}).join('')}</div>`;
}
/* ----- team, profile and access ----- */
function hostTeam(){
  const me=S.profile||{}, adm=S.auth.owner, opts=cur=>Object.keys(HR).map(k=>`<option value="${k}" ${k===cur?'selected':''}>${HR[k]}</option>`).join(''), dopts=cur=>'<option value="">No department</option>'+S.depts.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${esc(d.name)}</option>`).join('');
  let h=`<div class="cardx"><h3>My profile</h3><div class="formgrid"><label class="fl" for="pf-name">Full name<input class="addin" id="pf-name" value="${esc(me.full_name||'')}" data-field="hpf" data-k="full_name"></label><label class="fl" for="pf-job">Job title<input class="addin" id="pf-job" value="${esc(me.job_title||'')}" data-field="hpf" data-k="job_title"></label><label class="fl" for="pf-phone">WhatsApp number<input class="addin" id="pf-phone" value="${esc(me.phone||'')}" data-field="hpf" data-k="phone" placeholder="+971 5x xxx xxxx"></label></div>
    <small class="sub">${esc(me.email||'')} · ${HR[me.role]||''}${me.department_id?' · '+esc(deptOf(me.department_id).name):''}</small></div>`;
  if(adm)h+=`<div class="cardx"><h3>Access</h3><small class="sub">Only the people listed here can sign in, and only with their ${DOMAIN} email. Removing someone stops their access straight away. Tick Social media for the people who run your social accounts.</small>
    <div class="formgrid"><label class="fl" for="ac-email">Work email<input class="addin" id="ac-email" placeholder="name${DOMAIN}"></label><label class="fl" for="ac-name">Full name<input class="addin" id="ac-name"></label>
      <label class="fl" for="ac-dept">Department<select class="sel" id="ac-dept">${dopts('')}</select></label><label class="fl" for="ac-role">Role<select class="sel" id="ac-role">${opts('member')}</select></label>
      <label class="chk" for="ac-soc"><input type="checkbox" id="ac-soc">Social media</label><button class="btn" data-act="haddaccess">Give access</button></div>
    ${S.allowed.map(a=>{const p=S.people.find(x=>x.email===a.email);return `<div class="rowb" style="border-top:1px solid var(--line);padding-top:8px"><span style="flex:1 1 220px"><b>${esc(a.full_name||(p&&p.full_name)||a.email)}</b><br><small class="sub">${esc(a.email)} · ${p?'has signed in':'not signed in yet'}</small></span>
      <select class="sel" data-field="hacdept" data-id="${esc(a.email)}" aria-label="Department">${dopts(a.department_id)}</select><select class="sel" data-field="hacrole" data-id="${esc(a.email)}" aria-label="Role">${opts(a.role)}</select>
      <label class="chk"><input type="checkbox" data-field="hacsoc" data-id="${esc(a.email)}" ${a.social?'checked':''}>Social media</label>${a.email===me.email?'':`<button class="ghost sm danger" data-act="hrmaccess" data-id="${esc(a.email)}">Remove access</button>`}</div>`}).join('')}</div>`;
  const row=p=>{const m=S.members[p.id]||{};return `<div class="li">${chip(hostName(p))}<small style="flex:1 1 120px">${esc(p.job_title||'')}</small><span class="pill" style="border-radius:5px;padding:2px 9px;background:${p.role==='member'?'var(--s-todo)':'var(--green)'}">${HR[p.role]}</span><small>${esc(p.email)}</small>${p.id===S.auth.uid?'':shareLinks(m,'Hello','Hi '+hostName(p).split(' ')[0]+', ')}</div>`};
  h+=S.depts.map(d=>{const l=S.people.filter(p=>p.active&&p.department_id===d.id);return l.length?`<div class="list"><h3>${esc(d.name)} <span>${l.length}</span></h3>${l.map(row).join('')}</div>`:''}).join('');
  const nod=S.people.filter(p=>p.active&&!p.department_id); if(nod.length)h+=`<div class="list"><h3>No department yet</h3>${nod.map(row).join('')}</div>`;
  return h;
}
document.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.enter;if(e.key==='Enter'&&k){e.preventDefault();({hsendcode:hostSendCode,hverify:hostVerify})[k]()}});
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]'); if(!a)return; const d=a.dataset,act=d.act; if(act[0]!=='h')return;
  if(act==='hdemo'){CFG.demo=true;hostStart()}
  else if(act==='hsendcode')hostSendCode(); else if(act==='hverify')hostVerify(); else if(act==='hotheremail'){S.step='email';S.authErr='';showAuth()}
  else if(act==='hsignout'){try{await sb.auth.signOut()}catch(x){} S.session=null;S.hostOk=undefined;S.step='email'; if(sb&&sb._demo){showAuth()}else location.reload()}
  else if(act==='hsendreq'){const title=$('#rq-title').value.trim(),to=$('#rq-to').value;if(!title||!to){toast('Choose a department and say what you need.');return}
    Store.put('requests',uid(),{title,details:$('#rq-det').value.trim(),priority:$('#rq-pr').value,wantedBy:$('#rq-by').value||'',to,from:S.myDept||'',byUid:S.auth.uid,byName:S.me,status:'waiting',reason:'',at:Date.now()});toast('Request sent to '+deptOf(to).name+'.');render()}
  else if(act==='haccept'){const r=S.requests[d.id],who=$('#as-'+d.id).value;if(!r)return;if(!who){toast('Add someone to this department first.');return}
    let b=Object.keys(S.boards).map(id=>({id,...S.boards[id]})).find(x=>x.dept===r.to);
    if(!b){const bid='dept-'+r.to;Store.put('boards',bid,{name:deptOf(r.to).name||'Board',dept:r.to,order:Date.now(),createdAt:Date.now(),groups:[{id:'todo-'+r.to,name:'To-Do',color:GCOLORS[0]},{id:'done-'+r.to,name:'Completed',color:GCOLORS[1]}]});b={id:bid,...S.boards[bid]}}
    const tid=addTask(b.groups[0].id,r.title,{owner:who,due:r.wantedBy||'',priority:r.priority||'',notes:r.details||'',requestId:d.id},b.id);
    if(tid){Store.put('requests',d.id,{...r,status:'accepted',taskId:tid,assignee:who,assigneeUid:uidOf(who),taskStatus:'todo'});toast('Accepted and assigned to '+who+'.')}render()}
  else if(act==='hdecline'){const r=S.requests[d.id],why=$('#dr-'+d.id).value.trim();if(!r)return;if(!why){toast('Give a short reason so the sender knows why.');return}Store.put('requests',d.id,{...r,status:'declined',reason:why});render()}
  else if(act==='haddaccess'){const email=$('#ac-email').value.trim().toLowerCase();if(!email.endsWith(DOMAIN)||!/^[^\s@]+@/.test(email)){toast('Use a full '+DOMAIN+' email address.');return}
    const r=await sb.from('allowed_emails').insert({email,full_name:$('#ac-name').value.trim(),department_id:$('#ac-dept').value||null,role:$('#ac-role').value,social:$('#ac-soc').checked,added_by:S.auth.uid});
    if(r.error)toast(/duplicate/i.test(r.error.message||'')?email+' already has access.':'That could not be saved. Try again.');else toast(email+' can now sign in.');await hostLoadPeople();render()}
  else if(act==='hrmaccess')ask(`Remove access for ${d.id}? They will be locked out straight away.`,'Remove access',async()=>{await sb.from('allowed_emails').delete().eq('email',d.id);await hostLoadPeople();render()});
});
document.addEventListener('change',async e=>{
  const el=e.target,d=el.dataset,f=d.field; if(!f||f[0]!=='h')return;
  if(f==='hpf'){const r=await sb.from('profiles').update({[d.k]:el.value.trim()}).eq('id',S.auth.uid);if(r.error)toast('That could not be saved. Try again.');await hostLoadPeople();dirty=true}
  else if(f==='hacdept'||f==='hacrole'||f==='hacsoc'){const r=await sb.from('allowed_emails').update(f==='hacdept'?{department_id:el.value||null}:f==='hacrole'?{role:el.value}:{social:el.checked}).eq('email',d.id);if(r.error)toast('That could not be saved. Try again.');await hostLoadPeople();dirty=false;render()}
  else if(f==='hbdept'){const b=S.boards[S.cur];if(b){Store.put('boards',S.cur,{...b,dept:el.value});Object.keys(S.tasks).forEach(id=>{if(S.tasks[id].board===S.cur)Store.put('tasks',id,{...S.tasks[id]})});dirty=false;render()}}
});

/* ----- demo mode: sample data in this browser only, nothing is saved ----- */
function demoClient(){
  const now=()=>new Date().toISOString(), D=['HR','Listings','IT Support','Media','Marketing','CRM & Website','Accounts','Reception','Property Management','Designers'].map((n,i)=>({id:'d'+i,name:n,sort:i}));
  const P=[['u1','Demo Admin','admin','d2',0],['u2','Hana Director','management','d0',0],['u3','Omar Hassan','manager','d3',1],['u4','Lina Yousef','member','d3',1],['u5','Yusuf Karim','manager','d4',0],['u6','Sara Ali','member','d4',0]].map(([i,n,r,d,sc])=>({id:i,email:n.split(' ')[0].toLowerCase()+DOMAIN,full_name:n,job_title:'',phone:'',department_id:d,role:r,social:!!sc,active:true}));
  const docs=[], put=(coll,id,data)=>docs.push({coll,id,data}), day=o=>ymd(new Date(Date.now()+o*864e5));
  D.forEach((d,i)=>put('boards','dept-'+d.id,{name:d.name,dept:d.id,order:i,groups:[{id:'todo-'+d.id,name:'To-Do',color:GCOLORS[0]},{id:'done-'+d.id,name:'Completed',color:GCOLORS[1]}]}));
  [['Abu Dhabi landing page','d4','Sara Ali','u6','working','high',-1,100],['Ads live','d4','Sara Ali','u6','stuck','medium',1,500],['Monthly campaign report','d4','Yusuf Karim','u5','todo','',6,''],['Social media posting','d3','Lina Yousef','u4','done','medium',0,1000],['Listing video edit','d3','Lina Yousef','u4','todo','low',3,'']]
    .forEach(([n,dp,o,ou,st,pr,off,b],i)=>put('tasks','t'+i,{board:'dept-'+dp,group:'todo-'+dp,name:n,owner:o,ownerUid:ou,byUid:'u2',dept:dp,status:st,priority:pr,due:day(off),budget:b,ntype:'',files:[],tlStart:'',tlEnd:'',repeat:'none',doneDate:st==='done'?today():'',notes:'',updates:[],order:i,createdAt:Date.now(),updatedAt:Date.now(),updatedBy:'Hana Director'}));
  put('requests','r1',{title:'3 listing photos retouched',details:'For the Marina launch post.',priority:'high',wantedBy:day(2),to:'d3',from:'d4',byUid:'u5',byName:'Yusuf Karim',status:'waiting',reason:'',at:Date.now()});
  put('msgs','m1',{conv:'g:general',text:'Welcome to TaskDesk (demo).',by:'Hana Director',byUid:'u2',at:Date.now()});
  put('branches','b1',{name:'Dubai Marina',order:1,accounts:{instagram:'https://www.instagram.com/aeontrisl'}});
  let uid_='u1'; const me=()=>P.find(p=>p.id===uid_);
  const vis=(r)=>{const m=me(),mg=['admin','management'].includes(m.role),d=r.data,c=r.coll;
    if(c==='tasks')return mg||(m.role==='manager'&&d.dept===m.department_id)||d.ownerUid===uid_||d.byUid===uid_;
    if(c==='requests')return mg||d.byUid===uid_||d.assigneeUid===uid_||(m.role==='manager'&&[d.to,d.from].includes(m.department_id));
    if(c==='msgs')return d.conv==='g:general'||(d.dept&&(mg||d.dept===m.department_id))||(d.uids||[]).includes(uid_);
    if(c==='branches'||c==='posts')return mg||m.social; return true};
  const T={docs,profiles:P,departments:D,allowed_emails:P.map(p=>({email:p.email,full_name:p.full_name,department_id:p.department_id,role:p.role,social:p.social,added_at:now()}))};
  class Q{constructor(t){this.t=t;this.f=[];this.op='select'} select(){return this} insert(r){this.op='insert';this.r=r;return this} upsert(r){this.op='upsert';this.r=r;return this} update(r){this.op='update';this.r=r;return this} delete(){this.op='delete';return this}
    eq(k,v){this.f.push(r=>r[k]===v);return this} order(){return this} limit(){return this}
    then(res){const A=T[this.t],hit=r=>this.f.every(f=>f(r));let out=[];
      if(this.op==='upsert'){const i=A.findIndex(x=>x.coll===this.r.coll&&x.id===this.r.id);if(i>=0)A[i]=this.r;else A.push(this.r)}
      else if(this.op==='insert'){A.push({added_at:now(),...this.r})}
      else if(this.op==='update'){A.filter(hit).forEach(r=>Object.assign(r,this.r));if(this.t==='allowed_emails')A.filter(hit).forEach(a=>{const p=P.find(x=>x.email===a.email);if(p)Object.assign(p,{role:a.role,department_id:a.department_id,social:a.social})})}
      else if(this.op==='delete'){const gone=A.filter(hit);T[this.t]=A.filter(r=>!hit(r));if(this.t==='allowed_emails')gone.forEach(a=>{const p=P.find(x=>x.email===a.email);if(p)p.active=false})}
      else out=A.filter(r=>hit(r)&&(this.t!=='docs'||vis(r)));
      res({data:JSON.parse(JSON.stringify(out)),error:null})}}
  return {_demo:{get uid(){return uid_},set uid(v){uid_=v},people:P},from:t=>new Q(t),rpc:async()=>({data:true,error:null}),
    auth:{getSession:async()=>({data:{session:{user:{id:uid_,email:me().email}}}}),signOut:async()=>{},signInWithOtp:async()=>({error:null}),verifyOtp:async()=>({data:{session:{user:{id:uid_,email:me().email}}},error:null})},
    functions:{invoke:async()=>({data:{text:'This is a demo answer. On the live site the assistant reads your real tasks and replies here.'},error:null})},
    channel(){return {on(){return this},subscribe(){return this}}}};
}
function demoBar(){
  $('#demobar').innerHTML=`<div class="demo">Demo data. Nothing here is saved. View as <select class="sel" id="demo-user" aria-label="View as">${sb._demo.people.map(p=>`<option value="${p.id}" ${p.id===sb._demo.uid?'selected':''}>${esc(p.full_name)} (${HR[p.role]}${p.social?', social media':''})</option>`).join('')}</select></div>`;
  $('#demo-user').addEventListener('change',async e=>{sb._demo.uid=e.target.value;S.session={user:{id:e.target.value,email:''}};await hostEnter()});
}
